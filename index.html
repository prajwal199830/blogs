<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaleThali - 100 Dishes. 100 Stories. One Thali.</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <div class="logo">🍽️ TaleThali</div>
  <div class="header-right">
    <input type="text" id="search" placeholder="Search a dish...">
    <button id="darkToggle" title="Toggle dark mode">🌙</button>
    <button id="serveBtn" class="serve-btn">Serve Your Story</button>
  </div>
</header>

<main id="homeView">
  <section class="hero">
    <div class="thali-plate">
      <div class="thali-center">
        <h1>TaleThali</h1>
        <p>100 Dishes. 100 Stories.</p>
      </div>
      <div class="mini-katori k1">💖</div>
      <div class="mini-katori k2">👻</div>
      <div class="mini-katori k3">💼</div>
      <div class="mini-katori k4">😂</div>
      <div class="mini-katori k5">🏠</div>
      <div class="mini-katori k6">✈️</div>
    </div>
    <h2>Pick a bowl. Taste a story.</h2>
    <p class="subtitle">One thali, 100 different flavours of life.</p>
  </section>

  <section class="filters">
    <button class="filter-btn active" data-taste="all">All Dishes</button>
    <button class="filter-btn" data-taste="sweet">Sweet 🍯</button>
    <button class="filter-btn" data-taste="spicy">Spicy 🌶️</button>
    <button class="filter-btn" data-taste="tangy">Tangy 🍋</button>
    <button class="filter-btn" data-taste="comfort">Comfort 🍚</button>
  </section>

  <section id="categoryGrid" class="grid"></section>
</main>

<section id="categoryView" class="hidden">
  <button class="back" onclick="showHome()">← Back to Thali</button>
  <div class="category-header">
    <div id="catEmoji" class="big-bowl">🍲</div>
    <div>
      <h1 id="catName">Category</h1>
      <p id="catDish">Served as ...</p>
      <p id="catDesc"></p>
    </div>
  </div>
  <div id="blogList" class="blog-list"></div>
</section>

<section id="blogView" class="hidden">
  <button class="back" onclick="backToCategory()">← Back to Dish</button>
  <article id="blogArticle"></article>
</section>

<div id="addModal" class="modal hidden">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2>Serve Your Story to the Thali</h2>
    <input type="text" id="authorName" placeholder="Your Name">
    <select id="categorySelect"></select>
    <input type="text" id="subjectInput" placeholder="Subject Line">
    <textarea id="detailsInput" placeholder="Your full story details..."></textarea>
    <button onclick="saveStory()" id="saveBtn">Serve My Story →</button>
    <p id="saveStatus"></p>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
